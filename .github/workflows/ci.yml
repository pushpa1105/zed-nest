name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm build

  audit:
    name: Dependency audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Fails on high/critical advisories in what actually ships.
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      # The API contract of this commit, downloadable from the run (diff it between PRs).
      - run: pnpm openapi:export
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
          JWT_ACCESS_SECRET: ci-only-access-secret-ci-only-access-0001
          JWT_REFRESH_SECRET: ci-only-refresh-secret-ci-only-refresh-01
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zed-nest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
