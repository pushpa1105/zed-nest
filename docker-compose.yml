# Local development stack.
#
#   docker compose up -d                 → PostgreSQL only (run the API with `pnpm start:dev`)
#   docker compose --profile full up -d  → PostgreSQL + migrations + API container
#
name: zed-nest

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zed_nest
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zed_nest']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ['full']
    build: .
    command: ['node', 'dist/infrastructure/database/cli/migrate.js', 'latest']
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/zed_nest
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['full']
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: 'false'
      API_DOCS_ENABLED: 'true'
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/zed_nest
    ports:
      - '3000:3000'
    # Same hardening you want in production: immutable filesystem, no extra privileges.
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
